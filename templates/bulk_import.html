{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">📤 Bulk Import Users</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <h5>📋 Import Format</h5>
                        <p class="mb-2"><strong>For Teachers:</strong> username,password,email</p>
                        <p class="mb-0"><strong>For Students:</strong> username,password,email,grade</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Import Type</label>
                            <select name="import_type" class="form-select" required>
                                <option value="">Select type...</option>
                                <option value="teachers">Teachers</option>
                                <option value="students">Students</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">CSV Data</label>
                            <textarea name="csv_data" class="form-control" rows="10" placeholder="username,password,email,grade&#10;john_doe,password123,john@school.com,10&#10;jane_smith,password456,jane@school.com,11" required></textarea>
                            <div class="form-text">Enter one user per line. Include header row: username,password,email,grade</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">🚀 Import Users</button>
                            <a href="{{ url_for('school_admin_dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.form-text {
    font-size: 0.875rem;
    color: #6c757d;
}
</style>
{% endblock %}
