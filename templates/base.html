{% if session.user_id == 'sirius' %}
<!-- School Switcher for Sirius -->
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="school-switcher-banner py-2">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <span class="switcher-icon">🌍</span>
                        <strong class="switcher-label me-2">Platform View:</strong>
                        <select id="schoolSwitcher" class="form-select form-select-sm school-switcher-select">
                            <option value="">All Schools (Super Admin)</option>
                            {% for school in available_schools %}
                            <option value="{{ school.id }}" 
                                {% if current_school_id == school.id %}selected{% endif %}>
                                {{ school.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <span class="current-view-badge">
                        Viewing as: <strong>{{ current_school_name or 'Platform Admin' }}</strong>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.school-switcher-banner {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-bottom: 2px solid #5a67d8;
}

.school-switcher-select {
    width: 250px !important;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #2d3748;
}

.school-switcher-select:focus {
    background: white;
    border-color: #fff;
    box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25);
}

.switcher-icon {
    font-size: 1.2em;
    margin-right: 8px;
}

.switcher-label {
    color: white;
    font-weight: 600;
}

.current-view-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85em;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.current-view-badge strong {
    color: #e2e8f0;
}

/* Responsive */
@media (max-width: 768px) {
    .school-switcher-banner .d-flex {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start !important;
    }
    
    .school-switcher-select {
        width: 200px !important;
    }
    
    .current-view-badge {
        align-self: flex-end;
    }
}
</style>

<script>
// School switcher functionality
document.addEventListener('DOMContentLoaded', function() {
    const schoolSwitcher = document.getElementById('schoolSwitcher');
    if (schoolSwitcher) {
        schoolSwitcher.addEventListener('change', function() {
            const schoolId = this.value;
            window.location.href = '/switch-school/' + (schoolId || 'none');
        });
    }
});
</script>
{% endif %}
